name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # ubuntu-24.04 hat das Android SDK vorinstalliert (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Keystore aus Secret wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Signiertes Release-APK bauen
        env:
          VUMETER_KEYSTORE: ${{ runner.temp }}/release.jks
          VUMETER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VUMETER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VUMETER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk VU-Meter.apk

      - name: GitHub-Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: VU-Meter.apk
          generate_release_notes: true
